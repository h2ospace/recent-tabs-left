<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabs Stay Left の設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header class="header">
        <h1>Tabs Stay Left</h1>
        <button type="button" id="enabled" class="enable" aria-pressed="true">無効にする</button>
      </header>
      <section class="settings" aria-labelledby="behavior-heading">
        <h2 id="behavior-heading">動作</h2>
        <form id="settings">
          <div id="behavior" class="card">
            <div class="row">
              <p class="row-title">左端へ自動で移動</p>
              <div class="rule">
                <div class="field">
                  <input
                    id="dwell-seconds"
                    type="number"
                    min="0"
                    max="300"
                    step="1"
                    inputmode="numeric"
                    autocomplete="off"
                    required
                    value="3"
                    aria-label="移動するまでの秒数"
                  />
                  <span class="spinner">
                    <button type="button" id="dwell-up" aria-label="移動するまでの秒数を1増やす">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg>
                    </button>
                    <button type="button" id="dwell-down" aria-label="移動するまでの秒数を1減らす">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
                    </button>
                  </span>
                </div>
                <span>秒後に、左から</span>
                <div class="field">
                  <input
                    id="left-index"
                    type="number"
                    min="1"
                    max="100"
                    step="1"
                    inputmode="numeric"
                    autocomplete="off"
                    required
                    value="1"
                    aria-label="左から数えた移動位置"
                  />
                  <span class="spinner">
                    <button type="button" id="left-up" aria-label="左からの位置を1増やす">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg>
                    </button>
                    <button type="button" id="left-down" aria-label="左からの位置を1減らす">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
                    </button>
                  </span>
                </div>
                <span>番目に移動</span>
              </div>
            </div>
            <div class="row">
              <div class="copy">
                <p class="row-title">最大タブ数</p>
                <p class="hint">超えると右端のタブを閉じます。固定タブは残します。</p>
              </div>
              <div class="rule">
                <div class="field">
                  <input
                    id="max-tabs-count"
                    type="number"
                    min="1"
                    max="100"
                    step="1"
                    inputmode="numeric"
                    autocomplete="off"
                    required
                    value="20"
                    aria-label="最大タブ数"
                  />
                  <span class="spinner">
                    <button type="button" id="max-up" aria-label="最大タブ数を1増やす">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg>
                    </button>
                    <button type="button" id="max-down" aria-label="最大タブ数を1減らす">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
                    </button>
                  </span>
                </div>
                <span>件</span>
              </div>
            </div>
            <div id="focus" class="row">
              <div class="copy">
                <p id="focus-heading" class="row-title">同じURLのタブへ移動</p>
                <p id="focus-hint" class="hint">既に開いているURLの場合は、新しいタブを作らずそのタブを表示します</p>
              </div>
              <label class="switch">
                <input
                  id="focus-existing"
                  type="checkbox"
                  role="switch"
                  checked
                  aria-labelledby="focus-heading"
                />
                <span class="track" aria-hidden="true"></span>
              </label>
            </div>
          </div>
        </form>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
